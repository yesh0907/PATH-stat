name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: PATHKit package tests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &xcode
        name: Select newest installed Xcode
        id: xcode
        run: |
          developer_dir=$(python3 - <<'PY'
          from pathlib import Path
          import plistlib

          def version(app):
              with (app / 'Contents/Info.plist').open('rb') as info:
                  return tuple(map(int, plistlib.load(info)['CFBundleShortVersionString'].split('.')))

          apps = Path('/Applications').glob('Xcode*.app')
          newest = max((app for app in apps if (app / 'Contents/Developer').is_dir()), key=version)
          print(newest.resolve() / 'Contents/Developer')
          PY
          )
          sudo xcode-select --switch "$developer_dir"
          xcode_version=$(xcodebuild -version)
          printf '%s\n' "$xcode_version"
          echo "build=$(awk '/Build version/ {print $3}' <<< "$xcode_version")" >> "$GITHUB_OUTPUT"
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/PATHKit/.build
          key: swiftpm-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/PATHKit/**') }}
          restore-keys: swiftpm-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Test PATHKit
        run: |
          unset PATH_LIVE
          swift test --package-path Packages/PATHKit

  # Lightweight Linux job: decides whether the simulator suite must run (docs-only changes skip it).
  plan:
    name: Plan simulator run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: *checkout
        with:
          persist-credentials: false
          # Main pushes may contain more than one commit. Compare trees without fetching old blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Plan simulator run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=HEAD^1 ;; # First parent of GitHub's PR merge commit
            push) base=$BEFORE ;;
          esac

          run=true
          # Run the suite if the diff is unavailable or includes any non-documentation path.
          # Disable rename detection so moving a source file into docs still runs the suite.
          if [[ -n "$base" ]] && git diff --quiet --no-renames "$base" HEAD -- . \
            ':(top,glob,exclude)*.md' ':(top,exclude)docs/' ':(top,exclude)screenshots/'; then
            run=false
          fi
          echo "Run simulator tests: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Five disjoint shards run concurrently, each on its own runner with its own simulator
  # (no parallel clones). Each builds locally: transferring the products cost more than compiling.
  # Selectors together cover everything:
  #   core       PATHKitTests + PATHStatUITests/PATHStatUITests
  #   feedback-a four named FeedbackUITests cases
  #   feedback-b all other FeedbackUITests cases (including future ones)
  #   galleries  WidgetGalleryUITests + LiveActivityGalleryUITests
  #   other      every UI class except core, FeedbackUITests and the galleries (future classes land here)
  tests:
    name: Simulator tests (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            selectors: >-
              -only-testing:PATHKitTests
              -only-testing:PATHStatUITests/PATHStatUITests
          - shard: feedback-a
            selectors: >-
              -only-testing:PATHStatUITests/FeedbackUITests/testSendViaButton
              -only-testing:PATHStatUITests/FeedbackUITests/testQueuedWithoutToken
              -only-testing:PATHStatUITests/FeedbackUITests/testRemoveScreenshot
              -only-testing:PATHStatUITests/FeedbackUITests/testMainScreenHasSingleFeedbackButton
          - shard: feedback-b
            selectors: >-
              -only-testing:PATHStatUITests/FeedbackUITests
              -skip-testing:PATHStatUITests/FeedbackUITests/testSendViaButton
              -skip-testing:PATHStatUITests/FeedbackUITests/testQueuedWithoutToken
              -skip-testing:PATHStatUITests/FeedbackUITests/testRemoveScreenshot
              -skip-testing:PATHStatUITests/FeedbackUITests/testMainScreenHasSingleFeedbackButton
          - shard: galleries
            selectors: >-
              -only-testing:PATHStatUITests/WidgetGalleryUITests
              -only-testing:PATHStatUITests/LiveActivityGalleryUITests
          - shard: other
            selectors: >-
              -only-testing:PATHStatUITests
              -skip-testing:PATHStatUITests/PATHStatUITests
              -skip-testing:PATHStatUITests/FeedbackUITests
              -skip-testing:PATHStatUITests/WidgetGalleryUITests
              -skip-testing:PATHStatUITests/LiveActivityGalleryUITests
    steps:
      - uses: *checkout
        with:
          persist-credentials: false

      - *xcode

      - name: Select iPhone simulator
        id: simulator
        run: |
          simulator=$(xcrun simctl list --json | jq -er '
            ([.runtimes[] | select(.isAvailable and (.identifier | contains(".iOS-")))]
              | sort_by(.version | split(".") | map(tonumber)) | reverse) as $runtimes
            | first($runtimes[] as $runtime | .devices[$runtime.identifier][]?
                | select(.isAvailable and (.name | startswith("iPhone ")))
                | [.udid, .name, $runtime.version, $runtime.buildversion] | @tsv)
              // error("No available iPhone simulator")
          ')
          IFS=$'\t' read -r udid name version build <<< "$simulator"
          echo "Testing on $name (iOS $version, $build)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        timeout-minutes: 15
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          unset PATH_LIVE
          mkdir -p "$RUNNER_TEMP/pathstat-results"
          xcodebuild build-for-testing -quiet -project PATHStat.xcodeproj -scheme PATHStat \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/PATHStatDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/pathstat-results/Build.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO

      # Building while the simulator boots was slower on the hosted runners.
      - name: Boot simulator and wait
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run simulator tests
        timeout-minutes: 15
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SELECTORS: ${{ matrix.selectors }}
        run: |
          unset PATH_LIVE
          read -r -a selectors <<< "$SELECTORS"
          shopt -s nullglob
          test_runs=("$RUNNER_TEMP/PATHStatDerivedData/Build/Products/"*.xctestrun)
          if [[ ${#test_runs[@]} -ne 1 ]]; then
            echo "::error::Expected one PATHStat .xctestrun file, found ${#test_runs[@]}"
            exit 1
          fi
          # -retry-tests-on-failure -test-iterations 2 only re-runs tests that failed (at most
          # one extra attempt each); it does not run the suite twice.
          xcodebuild test-without-building -xctestrun "${test_runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -enableCodeCoverage NO \
            -resultBundlePath "$RUNNER_TEMP/pathstat-results/Tests.xcresult" \
            "${selectors[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI-test screenshots
        if: ${{ !cancelled() }}
        run: |
          results="$RUNNER_TEMP/pathstat-results"
          if [[ -d "$results/Tests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$results/Tests.xcresult" \
              --output-path "$results/attachments"
          fi

      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathstat-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/pathstat-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # Required check. Keep this exact name: branch protection matches it.
  app:
    name: App build and simulator tests
    needs: [plan, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check results
        env:
          RUN: ${{ needs.plan.outputs.run }}
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "plan=$PLAN run=$RUN tests=$TESTS"
          if [[ "$PLAN" != success ]]; then
            echo "::error::Planning did not succeed ($PLAN)"; exit 1
          fi
          if [[ "$RUN" == false ]]; then
            if [[ "$TESTS" != skipped ]]; then
              echo "::error::Docs-only run should skip the simulator tests"; exit 1
            fi
            echo "Docs-only change: simulator tests skipped"
            exit 0
          fi
          if [[ "$TESTS" != success ]]; then
            echo "::error::Simulator build or tests did not succeed ($TESTS)"; exit 1
          fi

      - name: Collect results
        if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pathstat-results-*
          path: ${{ runner.temp }}/pathstat-collected

      # Layout: pathstat-results-<shard>/{Build.xcresult,Tests.xcresult,attachments/} per shard.
      - name: Upload test results and screenshots
        if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pathstat-test-results
          path: ${{ runner.temp }}/pathstat-collected/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
